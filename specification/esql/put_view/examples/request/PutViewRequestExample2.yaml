summary: Create a view and validate the query
method_request: PUT /_query/view/country_addresses?validate=true
description: >
  Analyze the view query before saving it.
  When the query uses an unknown index or column, the response includes a warning and the view is still saved.
value: |-
  {
    "query": """
      FROM addresses
      | RENAME city.country.name AS country
      | EVAL country = CASE(country == "United States of America", "United States", country)
      | STATS count=COUNT() BY country
    """,
    "description": "Address counts by country"
  }
