summary: Reserved view
description: >
  A reserved view includes reserved set to true.
  This view is created when anomaly detection results exist.
value: |-
  {
    "views": [
      {
        "name": ".ml-anomalies",
        "query": """
          FROM .ml-anomalies-* METADATA _index
          | WHERE result_type IN ("bucket", "record", "influencer")
          | EVAL score = COALESCE(anomaly_score, record_score, influencer_score),
                 initial_score = COALESCE(initial_anomaly_score, initial_record_score, initial_influencer_score)
          | KEEP timestamp,
                 event.ingested,
                 job_id,
                 result_type,
                 is_interim,
                 score,
                 initial_score,
                 bucket_span,
                 function,
                 function_description,
                 field_name,
                 by_field_name,
                 by_field_value,
                 over_field_name,
                 over_field_value,
                 partition_field_name,
                 partition_field_value,
                 influencer_field_name,
                 influencer_field_value,
                 detector_index,
                 actual,
                 typical,
                 event_count,
                 processing_time_ms,
                 _index
        """,
        "description": "View that contains the results of machine learning anomaly detection jobs.",
        "reserved": true
      }
    ]
  }
