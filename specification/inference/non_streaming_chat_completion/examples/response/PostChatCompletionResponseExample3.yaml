summary: A non-streaming chat completion response with reasoning details
description: >
  A successful response from `POST _inference/chat_completion/reasoning-chat-completion` when the model
  returns structured reasoning data alongside its answer. The `message` includes a `reasoning` plaintext
  summary and a `reasoning_details` array covering all three detail types:
  `reasoning.encrypted` (opaque data), `reasoning.summary` (human-readable summary), and
  `reasoning.text` (full reasoning text with a verification signature).
  Currently supported only for the `elastic` provider.
