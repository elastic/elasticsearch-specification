summary: Query service accounts in a namespace
method_request: POST /_security/_query/service?with_profile_uid=true
description: >
  Run `POST /_security/_query/service?with_profile_uid=true` to get the enabled service accounts in the `apps` namespace,
  sorted by when they were created, newest first. The response includes the profile UIDs of the users who created and
  last replaced each account.
# type: request
value: |-
  {
    "query": {
      "bool": {
        "filter": [
          { "prefix": { "username": "apps/" } },
          { "term": { "enabled": true } }
        ]
      }
    },
    "sort": [
      { "created_at": { "order": "desc" } }
    ],
    "size": 10
  }
