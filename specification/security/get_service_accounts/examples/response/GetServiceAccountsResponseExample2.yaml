summary: User-managed service accounts in a namespace
description: >
  A successful response from `GET /_security/service/my-namespace?type=user_managed`.
  The response contains the user-managed service accounts in the `my-namespace` namespace.
# type: response
# response_code:
value: |-
  {
    "my-namespace/my-service": {
      "type": "user_managed",
      "roles": [
        "my_role"
      ],
      "enabled": true
    }
  }
