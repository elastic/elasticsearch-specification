summary: Create a user-managed service account
method_request: PUT /_security/service/my-namespace/my-service
description: >
  Run `PUT /_security/service/my-namespace/my-service` to create a service account that is granted
  the `my_role` role and can authenticate.
# type: request
value: |-
  {
    "roles": [
      "my_role"
    ],
    "enabled": true
  }
