# Pull request previews of the API Explorer. openapi-lint.yml writes the specs to api-preview/ (gitignored).
# A local spec replaces only the unreleased version, so a PR shows under /api/elasticsearch/next/.
api:
  elasticsearch:
    - spec: api-preview/elasticsearch.json
      product: elasticsearch
      repository: elastic/elasticsearch-specification
  elasticsearch-serverless:
    - spec: api-preview/elasticsearch-serverless.json
      product: serverless-elasticsearch
      repository: elastic/elasticsearch-specification
