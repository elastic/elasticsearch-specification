# Pull request preview of the API Explorer. openapi-lint.yml writes the specs next to this file.
# A local spec replaces only the unreleased version, so the PR shows under /api/elasticsearch/next/.
project: 'Elasticsearch API preview'
toc:
  - file: index.md
api:
  elasticsearch:
    - spec: elasticsearch.json
      product: elasticsearch
      repository: elastic/elasticsearch-specification
  elasticsearch-serverless:
    - spec: elasticsearch-serverless.json
      product: serverless-elasticsearch
      repository: elastic/elasticsearch-specification
