name: docs-preview-deploy

on:
  workflow_run:
    workflows: [openapi-lint]
    types: [completed]

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read

jobs:
  deploy:
    # TODO: switch to @v1 once docs-actions 1.71.0 (pre-build-artifact) is released.
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@main
    with:
      path: docs/api-preview
      path-pattern: '**'
      continue-on-error: 'true'
      pre-build-artifact: api-preview-specs
      pre-build-artifact-path: docs/api-preview
