name: docs-preview-deploy

on:
  workflow_run:
    workflows: [openapi-lint]
    types: [completed]

permissions:
  contents: read
  deployments: write
  id-token: write
  pull-requests: write
  actions: read

jobs:
  deploy:
    uses: elastic/docs-actions/.github/workflows/docs-deploy.yml@v1
    with:
      path: docs
      path-pattern: '**'
      continue-on-error: 'true'
      pre-build-artifact: api-preview-specs
      pre-build-artifact-path: docs/api-preview
