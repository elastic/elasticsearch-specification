name: openapi-lint

on:
  pull_request:
    branches:
      - main
      - '8.19'
      - '9.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    outputs:
      preview-specs: ${{ steps.upload-preview-specs.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build OpenAPI docs specs
        uses: ./.github/actions/build-openapi-docs

      - name: Lint stateful spec
        uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: output/openapi/elasticsearch-openapi-docs-final.json

      - name: Lint serverless spec
        uses: elastic/docs-actions/openapi/lint@v1
        with:
          spec-path: output/openapi/elasticsearch-serverless-openapi-docs-final.json

      # API Explorer overlays start from the same docs specs, so the docs preview reuses this build.
      # Same target openapi-publish.yml uses, so the preview matches what merging publishes.
      - name: Build API Explorer specs
        continue-on-error: true # the docs preview must never fail the lint
        run: |
          make overlay-api-explorer
          mkdir -p api-preview
          cp output/openapi/elasticsearch-openapi-docs-api-explorer.json api-preview/elasticsearch.json
          cp output/openapi/elasticsearch-serverless-openapi-docs-api-explorer.json api-preview/elasticsearch-serverless.json

      - name: Upload API Explorer specs
        id: upload-preview-specs
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-preview-specs
          path: api-preview
          retention-days: 1
          if-no-files-found: error

  # Renders docs/api-preview with the specs above. docs-preview-deploy.yml publishes it and comments the link.
  docs-preview:
    needs: build-and-lint
    if: needs.build-and-lint.outputs.preview-specs == 'success'
    permissions:
      contents: read
      pull-requests: read
    # TODO: switch to @v1 once docs-actions 1.71.0 (pre-build-artifact) is released.
    uses: elastic/docs-actions/.github/workflows/docs-build.yml@main
    with:
      path-pattern: '**'
      continue-on-error: 'true' # a broken preview never blocks the PR
      pre-build-artifact: api-preview-specs
      pre-build-artifact-path: docs/api-preview
