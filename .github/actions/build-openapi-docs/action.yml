name: Build OpenAPI docs specs
description: >
  Install dependencies and build the overlayed docs-ready OpenAPI specs. The default `overlay-docs` target writes
  the Bump.sh specs to output/openapi/elasticsearch-openapi-docs-final.json and
  output/openapi/elasticsearch-serverless-openapi-docs-final.json; `overlay-api-explorer` writes the API Explorer
  specs to output/openapi/elasticsearch-openapi-docs-api-explorer.json and
  output/openapi/elasticsearch-serverless-openapi-docs-api-explorer.json.

inputs:
  overlay-target:
    description: 'The make target that applies the overlays: overlay-docs (Bump.sh) or overlay-api-explorer'
    required: false
    default: 'overlay-docs'

runs:
  using: composite
  steps:
    - name: Setup Node 24
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: '**/package-lock.json'

    - name: Setup Dependencies
      shell: bash
      run: make setup

    - name: Build OpenAPI docs specs
      shell: bash
      run: make transform-to-openapi-for-docs

    - name: Apply OpenAPI overlays
      shell: bash
      env:
        OVERLAY_TARGET: ${{ inputs.overlay-target }}
      run: make "$OVERLAY_TARGET"
